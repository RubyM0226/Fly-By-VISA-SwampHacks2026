<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Fine paper fleck: noise turned into ink-coloured alpha, capped at 0.12. -->
  <filter id="p" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.106  0 0 0 0 0.169  0 0 0 0 0.188  2.5 0 0 0 -1.2"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.12"/></feComponentTransfer>
  </filter>
  <rect width="200" height="200" filter="url(#p)"/>
</svg>
